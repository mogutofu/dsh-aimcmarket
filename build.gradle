plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// 产物名固定为 aimcmarket-forge-1_20_1-v0_1_0.jar（project_version 里带 v）。
// mods.toml 里显示的版本仍是 0.1.0（mod_version）。
group = mod_group_id
version = project_version

// 本机构建时把 build/ 指到 D:\server\temp（仓库目录在某些受限环境下不可写）。
def overrideBuildDir = System.getenv('AIMC_BUILD_DIR')
if (overrideBuildDir) {
    layout.buildDirectory.set(new File(overrideBuildDir))
}

base {
    archivesName = 'aimcmarket-forge-1_20_1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'})"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // 纯服务端模组：本地开发也用 server 跑。
        }

        server {
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 单测只覆盖不碰 Minecraft 类的纯 Java 逻辑（经济/金融/政策/AI 解析），
    // 所以测试依赖要显式给出 junit 和 gson，不依赖开发环境里的 MC 类。
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('processResources', ProcessResources).configure {
    // 关键：源文件（mods.toml）和 expand 输出都必须按 UTF-8 读写，
    // 否则 Windows 默认代码页会把中文描述写成 ???。
    filteringCharset = 'UTF-8'
    var modDescriptionZh = 'AIMCmarket 是 Forge 1.20.1 的纯服务端 AI 市场模组：' +
            '玩家用 /ex 交易、炒股、买基金、存贷款、开公司、IPO、做期货期权，' +
            '市场先生和政府由本机 DSH 的 AI 接口驱动，记账与定价全部在模组内完成。'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : modDescriptionZh,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('test').configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
