# 8G 内存的小机器，构建时别把内存吃满；daemon 关掉，避免残留进程。
# 强制 UTF-8：不然中文描述/注释在 Windows 默认代码页下会变成 ???（properties 规范是 ISO-8859-1）。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false

## 环境属性
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.23
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod 属性
mod_id=aimcmarket
mod_name=AIMCmarket
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.mogutofu.aimcmarket
mod_authors=mogutofu
# 说明：中文描述写在 build.gradle 里（Properties 文件按 ISO-8859-1 读，中文会变 ?），
# 这里的值只做 ASCII 兜底。
mod_description=AIMCmarket: a server-side AI market and AI government mod for Forge 1.20.1.
project_version=v0_1_0
